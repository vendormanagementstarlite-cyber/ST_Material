<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surat Tugas Req Material</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EAF1FF">
<link rel="icon" href="logo.jpg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Surat Tugas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{margin:0;height:100%;background:#EAF1FF}
@media (prefers-color-scheme:dark){html,body{background:#0F1633}}
#ld{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:14px;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#5B6B8C;text-align:center;padding:16px}
#ld img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:28px;padding:8px;box-shadow:0 12px 30px rgba(60,100,210,.22)}
#ld a{color:#2C46D9;font-weight:700}
#app{position:fixed;top:env(safe-area-inset-top,0);right:0;bottom:0;left:0;height:auto;width:100%;border:0;background:transparent}
</style>
</head>
<body>
<div id="ld"><img src="logo.jpg" alt="Starlite"><div id="msg">Memuat aplikasi...</div></div>
<iframe id="app" title="Surat Tugas Req Material" allow="clipboard-write; clipboard-read; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script src="config.js"></script>
<script>
(function () {
  var base = String(window.APP_URL || '');
  var ok = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(base);
  var msg = document.getElementById('msg'), fr = document.getElementById('app');
  if (!ok) { msg.textContent = 'Link aplikasi belum diatur. Periksa file config.js.'; fr.hidden = true; return; }
  /* parameter pada alamat (mis. ?page=ttd&k=...) diteruskan ke aplikasi, sehingga link TTD tetap berfungsi */
  var q = location.search || '';
  var target = base + q + (location.hash || '');
  if (/(^|[?&])direct=1(&|$)/.test(q)) { location.replace(target); return; }
  fr.src = target;
  fr.addEventListener('load', function () { var ld = document.getElementById('ld'); if (ld) ld.style.display = 'none'; });
  setTimeout(function () {
    var ld = document.getElementById('ld');
    if (ld && ld.style.display !== 'none') msg.innerHTML = 'Masih memuat... Bila tidak muncul, <a href="' + target.replace(/"/g, '&quot;') + '">buka langsung</a>.';
  }, 8000);
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.protocol + '//' + location.hostname)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
}
</script>
</body>
</html>
