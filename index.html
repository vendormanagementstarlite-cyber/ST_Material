<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surat Tugas Req Material</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.jpg">
<style>
:root{--bg:#EAF1FF;--card:#fff;--ink:#16213E;--mute:#5B6B8C;--acc:#2C46D9;--acc2:#3F86F6}
@media (prefers-color-scheme:dark){:root{--bg:#0F1633;--card:#17214A;--ink:#EAF0FF;--mute:#A9B7DB;--acc:#6A8BFF;--acc2:#4C8CF7}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--bg),#DCE7FF);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
@media (prefers-color-scheme:dark){body{background:linear-gradient(160deg,#0F1633,#0A1029)}}
main{width:100%;max-width:420px;background:var(--card);border-radius:28px;padding:34px 26px 28px;text-align:center;box-shadow:0 24px 60px rgba(40,70,190,.18)}
.tile{width:112px;height:112px;margin:0 auto 18px;border-radius:32px;background:#fff;display:grid;place-items:center;box-shadow:0 12px 30px rgba(60,100,210,.22)}
.tile img{width:92px;height:92px;object-fit:contain;display:block}
h1{margin:0 0 6px;font-size:24px}
p{margin:0 0 20px;color:var(--mute);font-size:14.5px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 28px;border-radius:999px;background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff;font-weight:700;text-decoration:none;box-shadow:0 10px 22px rgba(44,70,217,.3)}
.bar{height:4px;border-radius:99px;background:rgba(120,140,200,.25);overflow:hidden;margin:0 0 18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));animation:go 1.2s linear forwards}
@keyframes go{to{width:100%}}
small{display:block;margin-top:18px;color:var(--mute);font-size:12px;letter-spacing:.4px}
</style>
</head>
<body>
<main>
  <div class="tile"><img src="logo.jpg" alt="Starlite"></div>
  <h1>Surat Tugas Req Material</h1>
  <p id="msg">Membuka aplikasi...</p>
  <div class="bar" id="bar"><i></i></div>
  <a class="btn" id="go" href="#">Buka Aplikasi</a>
  <small>Proyek Starlite &bull; Vendor Management</small>
</main>
<script src="config.js"></script>
<script>
(function () {
  var base = String(window.APP_URL || '');
  var ok = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(base);
  var go = document.getElementById('go'), msg = document.getElementById('msg'), bar = document.getElementById('bar');
  if (!ok) { msg.textContent = 'Link aplikasi belum diatur. Periksa file config.js.'; bar.hidden = true; go.hidden = true; return; }
  /* teruskan parameter (mis. ?page=ttd&k=...) agar link TTD tetap berfungsi bila dibuka lewat halaman ini */
  var target = base + (location.search || '') + (location.hash || '');
  go.href = target;
  var stay = /(^|[?&])stay=1(&|$)/.test(location.search);
  if (stay) { msg.textContent = 'Klik tombol untuk membuka aplikasi.'; bar.hidden = true; return; }
  setTimeout(function () { location.replace(target); }, 1200);
})();
</script>
</body>
</html>
