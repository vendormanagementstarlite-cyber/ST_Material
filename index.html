<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surat Tugas Req Material</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EAF1FF">
<link rel="icon" href="logo.jpg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Surat Tugas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{margin:0;height:100%;background:#EAF1FF}
@media (prefers-color-scheme:dark){html,body{background:#0F1633}}
#ld{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:14px;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#5B6B8C;text-align:center;padding:16px}
#ld .rg{position:relative;width:132px;height:132px;display:grid;place-items:center}
#ld .rg::before{content:'';position:absolute;inset:0;border-radius:50%;border:4px solid rgba(44,70,217,.15);border-top-color:#2C46D9;animation:rot .9s linear infinite}
#ld img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:28px;padding:8px;box-shadow:0 12px 30px rgba(60,100,210,.22);animation:pls 1.8s ease-in-out infinite}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes pls{50%{transform:scale(.93)}}
#ld{transition:opacity .25s}#ld.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#ld .rg::before,#ld img{animation-duration:3s}}
#ld a{color:#2C46D9;font-weight:700}
#app{position:fixed;top:env(safe-area-inset-top,0);right:0;bottom:0;left:0;height:calc(100% - env(safe-area-inset-top,0px));width:100%;border:0;background:transparent}
</style>
</head>
<body>
<div id="ld"><div class="rg"><img src="logo.jpg" alt="Starlite"></div><div id="msg">Memuat aplikasi...</div></div>
<iframe id="app" title="Surat Tugas Req Material" allow="clipboard-write; clipboard-read; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script src="config.js"></script>
<script>
(function () {
  var base = String(window.APP_URL || '');
  var ok = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(base);
  var msg = document.getElementById('msg'), fr = document.getElementById('app');
  if (!ok) { msg.textContent = 'Link aplikasi belum diatur. Periksa file config.js.'; fr.hidden = true; return; }
  /* parameter pada alamat (mis. ?page=ttd&k=...) diteruskan ke aplikasi, sehingga link TTD tetap berfungsi */
  var q = location.search || '';
  var target = base + q + (location.hash || '');
  if (/(^|[?&])direct=1(&|$)/.test(q)) { location.replace(target); return; }
  fr.src = target;
  /* layar logo bertahan sampai aplikasi di dalamnya siap (pesan 'ready'), agar tidak ada layar kosong */
  function hide() { var ld = document.getElementById('ld'); if (ld && !ld.__h) { ld.__h = 1; ld.className = 'out'; setTimeout(function () { ld.style.display = 'none'; }, 300); } }
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.st !== 'ready') return;
    try { if (!/(^|\.)google(usercontent)?\.com$/.test(new URL(e.origin).hostname)) return; } catch (x) { return; }
    hide();
  });
  fr.addEventListener('load', function () { setTimeout(hide, 6000); }); /* cadangan bila pesan 'ready' tidak sampai */
  setTimeout(function () {
    var ld = document.getElementById('ld');
    if (ld && !ld.__h) msg.innerHTML = 'Masih memuat... koneksi mungkin lambat. <a href="#" onclick="location.reload();return false">Muat ulang</a>';
  }, 8000);
})();
</script>
<script>
/* Tombol "Instal Aplikasi" di dalam aplikasi meminta pemasangan lewat halaman ini */
(function () {
  var dp = null, installed = false;
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  var stand = function () { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; };
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); dp = e; });
  window.addEventListener('appinstalled', function () { installed = true; dp = null; });
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || d.st !== 'install') return;
    var host = ''; try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (!/(^|\.)google(usercontent)?\.com$/.test(host)) return;
    function rep(r) { try { e.source.postMessage({ st: 'install-res', r: r }, '*'); } catch (x) { } }
    if (installed || stand()) { rep('installed'); return; }
    if (!dp) { rep(ios ? 'ios' : 'manual'); return; }
    try {
      var ev = dp; dp = null; ev.prompt();
      ev.userChoice.then(function (c) { rep(c.outcome === 'accepted' ? 'accepted' : 'dismissed'); }, function () { rep('manual'); });
    } catch (x) { rep('manual'); }
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https:|^http:\/\/localhost/.test(location.protocol + '//' + location.hostname)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
}
</script>
</body>
</html>
